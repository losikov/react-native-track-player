buildscript {
    ext.safeExtGet = {prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
    repositories {
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.3.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.22")
    }
}

apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'
apply plugin: 'org.jetbrains.kotlin.android'

def getExtOrIntegerDefault(name) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['RNTP_' + name]).toInteger()
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 33)
    namespace "com.doublesymmetry.trackplayer"
}

repositories {
    mavenCentral()
    google()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'com.facebook.react:react-native'
    
    // KotlinAudio from JitPack (GitHub)
    // Using branch-SNAPSHOT format - JitPack builds on-demand, first build may take 3-5 minutes
    // Latest commit with Java 17 fix: 85758f3168487c1b9596a2e79b527c14457293d5
    // For specific commit: 'com.github.losikov:KotlinAudio:85758f3'
    // Note: Make sure the branch 'aa23-media-session-fixes-from-dev-aa' is pushed to GitHub
    implementation 'com.github.losikov:KotlinAudio:aa23-media-session-fixes-from-dev-aa-SNAPSHOT'
    
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    implementation "androidx.lifecycle:lifecycle-process:2.5.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.3"
    implementation 'androidx.media:media:1.6.0'
}
